<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookCraft</title>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
              serif: ['Merriweather', 'ui-serif', 'Georgia', 'Cambria', 'Times New Roman', 'Times', 'serif'],
            },
            colors: {
              notion: {
                bg: '#FFFFFF',
                sidebar: '#F7F7F5',
                hover: '#EFEFED',
                active: 'rgba(55, 53, 47, 0.08)',
                text: '#37352F',
                'text-light': 'rgba(55, 53, 47, 0.65)',
                'text-lighter': 'rgba(55, 53, 47, 0.45)',
                border: '#E9E9E7',
              }
            },
            typography: (theme) => ({
              DEFAULT: {
                css: {
                  maxWidth: '100%',
                  color: '#37352F',
                  fontFamily: theme('fontFamily.sans'),
                  h1: { 
                    fontWeight: '700',
                    color: '#37352F',
                    letterSpacing: '-0.02em',
                  },
                  h2: { 
                    fontWeight: '600',
                    color: '#37352F',
                    letterSpacing: '-0.01em',
                    marginTop: '1.4em',
                  },
                  h3: { 
                    fontWeight: '600',
                    color: '#37352F',
                    marginTop: '1em',
                  },
                  p: {
                    marginTop: '0.25em',
                    marginBottom: '0.25em',
                    lineHeight: '1.6',
                  },
                  'code::before': { content: '""' },
                  'code::after': { content: '""' },
                  code: {
                    backgroundColor: 'rgba(135,131,120,0.15)',
                    padding: '0.2em 0.4em',
                    borderRadius: '3px',
                    fontWeight: '400',
                    color: '#EB5757',
                  },
                  blockquote: {
                    borderLeftColor: '#37352F',
                    fontStyle: 'normal',
                    opacity: '0.8',
                  }
                },
              },
            }),
          },
        },
        plugins: [
          function({ addBase, theme }) {
            addBase({
              'body': { 
                color: theme('colors.notion.text'), 
                backgroundColor: theme('colors.notion.bg'),
              },
            })
          }
        ]
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(55, 53, 47, 0.16);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(55, 53, 47, 0.24);
      }

      /* ===== Tiptap 编辑器样式 ===== */
      .ProseMirror {
        outline: none;
        min-height: 300px;
        padding-bottom: 30vh;
        line-height: 1.7;
      }

      .ProseMirror p.is-editor-empty:first-child::before {
        color: rgba(55, 53, 47, 0.4);
        content: attr(data-placeholder);
        float: left;
        height: 0;
        pointer-events: none;
      }

      /* 标题样式 */
      .ProseMirror h1 {
        font-size: 2.25rem;
        font-weight: 700;
        line-height: 1.2;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        color: #1e293b;
        letter-spacing: -0.02em;
      }

      .ProseMirror h2 {
        font-size: 1.75rem;
        font-weight: 600;
        line-height: 1.3;
        margin-top: 1.25rem;
        margin-bottom: 0.6rem;
        color: #334155;
        letter-spacing: -0.01em;
      }

      .ProseMirror h3 {
        font-size: 1.375rem;
        font-weight: 600;
        line-height: 1.4;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
        color: #475569;
      }

      .ProseMirror h4 {
        font-size: 1.125rem;
        font-weight: 600;
        line-height: 1.5;
        margin-top: 0.75rem;
        margin-bottom: 0.4rem;
        color: #64748b;
      }

      /* 段落样式 */
      .ProseMirror p {
        margin: 0.35rem 0;
      }

      .ProseMirror p:first-child {
        margin-top: 0;
      }

      /* 代码块样式 */
      .ProseMirror pre {
        background: #1e293b;
        border-radius: 0.5rem;
        color: #e2e8f0;
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
        font-size: 0.875rem;
        margin: 1rem 0;
        overflow-x: auto;
        padding: 1rem;
        line-height: 1.5;
      }

      .ProseMirror pre code {
        background: none;
        border: none;
        color: inherit;
        font-size: inherit;
        padding: 0;
        font-family: inherit;
      }

      /* 行内代码样式 */
      .ProseMirror code {
        background: rgba(135, 131, 120, 0.15);
        border-radius: 0.25rem;
        color: #EB5757;
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
        font-size: 0.875em;
        padding: 0.125rem 0.375rem;
      }

      .ProseMirror pre code {
        color: #e2e8f0;
        background: transparent;
        padding: 0;
      }

      /* 代码块语法高亮 */
      .ProseMirror pre .hljs-keyword,
      .ProseMirror pre .hljs-built_in { color: #c792ea; }
      .ProseMirror pre .hljs-string,
      .ProseMirror pre .hljs-template-string { color: #c3e88d; }
      .ProseMirror pre .hljs-number { color: #f78c6c; }
      .ProseMirror pre .hljs-comment { color: #546e7a; font-style: italic; }
      .ProseMirror pre .hljs-function { color: #82aaff; }
      .ProseMirror pre .hljs-class { color: #ffcb6b; }
      .ProseMirror pre .hljs-variable { color: #f07178; }
      .ProseMirror pre .hljs-operator { color: #89ddff; }
      .ProseMirror pre .hljs-tag { color: #f07178; }
      .ProseMirror pre .hljs-attribute { color: #c792ea; }
      .ProseMirror pre .hljs-title { color: #82aaff; }
      .ProseMirror pre .hljs-property { color: #82aaff; }
      .ProseMirror pre .hljs-punctuation { color: #89ddff; }
      .ProseMirror pre .hljs-param { color: #f78c6c; }

      /* 引用块样式 */
      .ProseMirror blockquote {
        border-left: 3px solid #37352f;
        color: rgba(55, 53, 47, 0.7);
        font-style: normal;
        margin: 1rem 0;
        padding-left: 1rem;
      }

      /* 列表样式 */
      .ProseMirror ul,
      .ProseMirror ol {
        margin: 0.5rem 0;
        padding-left: 1.5rem;
      }

      .ProseMirror li {
        margin: 0.2rem 0;
      }

      .ProseMirror li p {
        margin: 0;
      }

      /* 水平线样式 */
      .ProseMirror hr {
        border: none;
        border-top: 1px solid #e2e8f0;
        margin: 1.5rem 0;
      }

      /* 表格样式 */
      .ProseMirror table {
        border-collapse: collapse;
        margin: 1rem 0;
        overflow: hidden;
        table-layout: fixed;
        width: 100%;
      }

      .ProseMirror table td,
      .ProseMirror table th {
        border: 1px solid #e2e8f0;
        box-sizing: border-box;
        min-width: 1em;
        padding: 0.4rem 0.6rem;
        position: relative;
        vertical-align: top;
      }

      .ProseMirror table th {
        background: #f8fafc;
        color: #475569;
        font-weight: 600;
        text-align: left;
      }

      .ProseMirror table .selectedCell:after {
        background: rgba(59, 130, 246, 0.1);
        content: '';
        height: 100%;
        left: 0;
        position: absolute;
        top: 0;
        width: 100%;
      }

      .ProseMirror table .column-resize-handle {
        background: #3b82f6;
        bottom: -2px;
        position: absolute;
        right: -2px;
        top: 0;
        width: 4px;
        cursor: col-resize;
        z-index: 20;
      }

      .ProseMirror table p {
        margin: 0;
      }

      /* 选中文本样式 */
      .ProseMirror ::selection {
        background: #bfdbfe;
      }

      /* 链接样式 */
      .ProseMirror a {
        color: #3b82f6;
        text-decoration: underline;
        cursor: pointer;
      }

      .ProseMirror a:hover {
        color: #2563eb;
      }

      /* 粗体、斜体、删除线样式 */
      .ProseMirror strong {
        font-weight: 600;
      }

      .ProseMirror em {
        font-style: italic;
      }

      .ProseMirror s {
        text-decoration: line-through;
        color: #9ca3af;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "zustand": "https://esm.sh/zustand@^5.0.9",
    "dexie": "https://esm.sh/dexie@^4.2.1",
    "@tiptap/extension-placeholder": "https://esm.sh/@tiptap/extension-placeholder@^3.14.0",
    "@tiptap/react": "https://esm.sh/@tiptap/react@^3.14.0",
    "@tiptap/starter-kit": "https://esm.sh/@tiptap/starter-kit@^3.14.0"
  }
}
</script>
</head>
  <body class="antialiased overflow-hidden selection:bg-[#B4D5FE] selection:text-inherit">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
